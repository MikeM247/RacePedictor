const iso=d=>d.toISOString().slice(0,10);const dateLabel=d=>new Intl.DateTimeFormat('en-ZA',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(d);function data(d){let n=d.getUTCDate(),w=d.getUTCDay(),key=iso(d);if(key==='2026-11-01')return {title:'Oldies 10 km benchmark',p:'13 km',meta:'95 min · RPE 6',r:'10 km',duration:'59:23',record:'Oldies 10k'};if(key==='2026-10-27')return {title:'Easy supporting run',p:'6 km',meta:'48 min · RPE 3',r:'6 km',duration:'49:56',record:'Morning run'};if(w===1||w===5)return {title:'Rest and recovery',p:'Rest',meta:'Intentional rest'};return {title:w===3?'Wednesday endurance':w===0?'Easy long run':w===4?'Controlled threshold':'Easy supporting run',p:(w===0?'16':w===3?'9':'6')+' km',meta:w===0?'128 min · RPE 3':w===4?'48 min · RPE 6':'48 min · RPE 3'}}
function details(key,focus=false){selected=key;let d=new Date(key+'T12:00:00Z'),s=data(d);document.querySelector('#detail').innerHTML=`<div><span class="eyebrow">${key==='2026-11-01'?'Today':'Selected day'}</span><h2 style="margin-top:8px">${new Intl.DateTimeFormat('en-ZA',{weekday:'long',timeZone:'UTC'}).format(d)}</h2><div class="date">${dateLabel(d)}</div><span class="planned-label" style="font-size:12px">PLANNED</span><h3>${s.title}</h3><p>${s.p==='Rest'?'Absorb training and preserve continuity.':s.p+' · '+s.meta}</p><button class="action" id="open-plan">View planned session →</button></div>${s.r?`<div class="session"><span class="recorded-label" style="font-size:12px">RECORDED</span><h3>${s.record}</h3><div class="facts"><div><b>${s.r}</b><small>Distance</small></div><div><b>${s.duration}</b><small>Duration</small></div></div><button class="action" id="open-activity">View recorded activity →</button></div>`:`<div class="session"><span class="eyebrow">Recorded activity</span><p style="margin-top:10px">No activity recorded in this sample.</p></div>`}<p class="note">Illustrative data. A recorded run does not automatically confirm completion of a planned session.</p>`;document.querySelector('#open-plan').onclick=()=>showDialog('Planned session · '+dateLabel(d),'Sample prescription: '+s.title+' · '+s.p+' · '+s.meta+'. The application keeps the approved prescription, amendment history and existing permitted actions in its full Day details view.');if(s.r)document.querySelector('#open-activity').onclick=()=>showDialog(s.record,'Sample recorded activity: '+s.r+' in '+s.duration+'. Implementation reuses the existing full-viewport activity detail dialog.');document.querySelectorAll('.day').forEach(b=>{let yes=b.dataset.date===key;b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',String(yes))});}
function baseRender(){document.body.className='variant-'+option;document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.option===option)));document.querySelector('#subtitle').textContent=titles[option-1];document.querySelector('#rationale').textContent=reasons[option-1];let first=new Date(Date.UTC(year,month,1,12)),start=new Date(first);start.setUTCDate(1-(first.getUTCDay()+6)%7);let rows= Math.ceil(((first.getUTCDay()+6)%7+new Date(Date.UTC(year,month+1,0)).getUTCDate())/7);if(option===99){start=new Date('2026-10-26T12:00:00Z');start.setUTCDate(start.getUTCDate()+weekOffset*7);rows=1}document.querySelector('#range').textContent=option===99?new Intl.DateTimeFormat('en-ZA',{day:'numeric',month:'short',timeZone:'UTC'}).format(start)+' – '+new Intl.DateTimeFormat('en-ZA',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(+start+6*86400000)):new Intl.DateTimeFormat('en-ZA',{month:'long',year:'numeric',timeZone:'UTC'}).format(first);document.querySelector('#previous').setAttribute('aria-label',option===99?'Previous week':'Previous month');document.querySelector('#next').setAttribute('aria-label',option===99?'Next week':'Next month');let markup='';for(let r=0;r<rows;r++){let mon=new Date(+start+r*7*86400000);markup+=`<div class="week-start">Week of ${new Intl.DateTimeFormat('en-ZA',{day:'numeric',month:'short',timeZone:'UTC'}).format(mon)}</div><div class="week ${option===98&&selected>=iso(mon)&&selected<=iso(new Date(+mon+6*86400000))?'selected-week':''}">`;for(let c=0;c<7;c++){let d=new Date(+mon+c*86400000),k=iso(d),s=data(d);markup+=`<button class="day ${d.getUTCMonth()!==month?'outside':''}" data-date="${k}" aria-label="${dateLabel(d)}. Planned: ${s.title}, ${s.p}.${s.r?' Recorded: '+s.r+'.':''}" aria-pressed="false"><span class="daynum"><span class="${k==='2026-11-01'?'today':''}">${d.getUTCDate()}</span>${k==='2026-11-01'?'<em style="font-size:10px;font-style:normal;color:var(--cyan)">Today</em>':''}</span><span class="event ${s.p==='Rest'?'rest':''}"><b>${s.title}</b><small>${s.p==='Rest'?'':s.p+' · '+s.meta}</small></span>${s.r?`<span class="event recorded"><b>${s.record}</b><small>${s.r} · ${s.duration}</small></span>`:''}<span class="compact"><span>P ${s.p}</span>${s.r?`<span class="r">R ${s.r}</span>`:''}</span></button>`}markup+='</div>'}document.querySelector('#weeks').innerHTML=markup;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{details(b.dataset.date,true);if(false){document.querySelectorAll('.week').forEach(w=>w.classList.toggle('selected-week',!!w.querySelector('.selected')))}});details(selected)}document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{option=+b.dataset.option;let u=new URL(location);u.searchParams.set('option',option);history.replaceState(null,'',u);render()});function move(step){if(option===99){weekOffset+=step;selected=iso(new Date(Date.UTC(2026,9,26+weekOffset*7,12)))}else{let d=new Date(Date.UTC(year,month+step,1));year=d.getUTCFullYear();month=d.getUTCMonth();selected=iso(d)}render()}document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#today').onclick=()=>{year=2026;month=10;weekOffset=0;selected='2026-11-01';render()};

function renderWeeks(){baseRender();document.querySelector('.layout').className='layout';const weeks=[...document.querySelectorAll('.week')];weeks.forEach((week,i)=>{const label=week.previousElementSibling;const wrap=document.createElement('div');wrap.className='week-block';label.before(wrap);wrap.append(label,week);let planned=0,recorded=0,minutes=0,actualSeconds=0;week.querySelectorAll('.day').forEach(day=>{let d=data(new Date(day.dataset.date+'T12:00:00Z'));planned+=parseFloat(d.p)||0;recorded+=parseFloat(d.r)||0;minutes+=parseInt(d.meta)||0;if(d.duration){let parts=d.duration.split(':').map(Number);actualSeconds+=parts.length===2?parts[0]*60+parts[1]:parts[0]*3600+parts[1]*60+parts[2]}});const summary=document.createElement('div');summary.className='weekly-total';summary.setAttribute('aria-label',label.textContent+' totals');summary.innerHTML=`<span class="total-title">Weekly totals</span><span class="total-p"><span>Planned</span><strong>${planned} <small>km</small></strong><em>${Math.floor(minutes/60)}h ${String(minutes%60).padStart(2,'0')}m</em></span><span class="total-r"><span>Recorded</span><strong>${recorded} <small>km</small></strong><em>${Math.floor(actualSeconds/3600)}h ${String(Math.floor(actualSeconds%3600/60)).padStart(2,'0')}m</em></span>`;wrap.append(summary)});document.querySelector('#range').textContent=new Intl.DateTimeFormat('en-ZA',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(year,month,1)));document.querySelector('#detail').setAttribute('aria-live','polite');}
function render(){renderWeeks();let planned=0,recorded=0,minutes=0,actualSeconds=0,sessions=0,runs=0;const days=new Date(Date.UTC(year,month+1,0)).getUTCDate();for(let n=1;n<=days;n++){const d=data(new Date(Date.UTC(year,month,n,12)));planned+=parseFloat(d.p)||0;recorded+=parseFloat(d.r)||0;minutes+=parseInt(d.meta)||0;if(d.p!=='Rest')sessions++;if(d.r)runs++;if(d.duration){const parts=d.duration.split(':').map(Number);actualSeconds+=parts.length===2?parts[0]*60+parts[1]:parts[0]*3600+parts[1]*60+parts[2]}}const name=new Intl.DateTimeFormat('en-ZA',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(year,month,1)));const time=m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;const el=document.querySelector('#monthly');el.dataset.planned=planned;el.dataset.recorded=recorded;el.dataset.plannedMinutes=minutes;el.dataset.recordedSeconds=actualSeconds;el.dataset.days=days;el.innerHTML=`<div class="month-heading"><span class="eyebrow">Whole-month totals</span><h2 id="monthly-title">${name}</h2><p>1–${days} ${name} only · adjacent-month dates excluded</p></div><div class="month-facts"><div class="month-group month-planned"><h3>Planned</h3><div class="month-metrics"><div><span>Distance</span><strong>${planned} <small>km</small></strong></div><div><span>Duration</span><strong>${time(minutes)}</strong></div><div><span>Sessions</span><strong>${sessions}</strong></div></div></div><div class="month-group month-recorded"><h3>Recorded</h3><div class="month-metrics"><div><span>Distance</span><strong>${recorded} <small>km</small></strong></div><div><span>Duration</span><strong>${time(Math.floor(actualSeconds/60))} ${actualSeconds%60}s</strong></div><div><span>Activities</span><strong>${runs}</strong></div></div></div></div><p class="month-note">Sample data · Recorded totals reflect available activities, not a completion score.</p>`;}
render();
